name: career-engine

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api: &api
  image: career-engine-api:local
  build:
    context: ./backend
  init: true
  environment:
    APP_ENV: production
    DATABASE_URL: postgresql+asyncpg://career_engine:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/career_engine
    FRONTEND_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN in .env}
    PUBLIC_SITE_BASE_URL: https://${APP_DOMAIN}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}
    GOOGLE_LOGIN_REDIRECT_URI: https://${APP_DOMAIN}/api/v1/auth/google/login/callback
    GOOGLE_REDIRECT_URI: https://${APP_DOMAIN}/api/v1/auth/google/callback
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
    COOKIE_SECURE: "true"
    COOKIE_SAMESITE: lax
    PROJECT_AUTOFILL_AGENT_WORKSPACE_DIR: /data/codexpert
    HF_HOME: /data/huggingface
    PROJECT_AUTOFILL_LLM_PROVIDER: ${PROJECT_AUTOFILL_LLM_PROVIDER:-mistral}
    MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    OMP_NUM_THREADS: "2"
    TOKENIZERS_PARALLELISM: "false"
  volumes:
    - analysis_data:/data/codexpert
    - model_cache:/data/huggingface
  logging: *logging

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: career_engine
      POSTGRES_DB: career_engine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *logging

  migrate:
    <<: *api
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  web:
    image: career-engine-web:local
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

volumes:
  postgres_data:
  analysis_data:
  model_cache:
  caddy_data:
  caddy_config:
